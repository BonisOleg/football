{% load static %}
{% if site.logo %}
<img
  class="cup-logo"
  src="{{ site.logo.url }}"
  height="{{ size|default:40 }}"
  alt="{{ site.site_name|default:'Football Generation' }}"
  decoding="async"
>
{% else %}
<img
  class="cup-logo"
  src="{% static 'images/football-generation-logo.png' %}"
  height="{{ size|default:40 }}"
  alt="Football Generation"
  decoding="async"
>
{% endif %}

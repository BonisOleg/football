{% with icon_size=size|default:22 %}
<svg class="season-icon" width="{{ icon_size }}" height="{{ icon_size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
  {% if season == "Spring" %}
  <path d="M12 3 v18" />
  <path d="M12 8 C8 8 6 6 6 4" />
  <path d="M12 12 C16 12 18 10 18 8" />
  <path d="M12 16 C8 16 6 14 6 12" />
  {% elif season == "Summer" %}
  <circle cx="12" cy="12" r="4.5" />
  <path d="M12 2 v2 M12 20 v2 M2 12 h2 M20 12 h2 M4.5 4.5 L6 6 M18 18 L19.5 19.5 M19.5 4.5 L18 6 M6 18 L4.5 19.5" />
  {% elif season == "Autumn" %}
  <path d="M12 3 C7 7 5 11 5 14 a7 7 0 0 0 14 0 c0-3-2-7-7-11Z" stroke-linejoin="round" />
  <path d="M12 6 v15" />
  {% elif season == "Winter" %}
  <path d="M12 3 v18 M3 12 h18 M5.5 5.5 L18.5 18.5 M18.5 5.5 L5.5 18.5" />
  {% elif season == "Kids" %}
  <circle cx="12" cy="12" r="4" />
  <path d="M12 3 v3 M12 18 v3 M3 12 h3 M18 12 h3 M5.5 5.5 L7.5 7.5 M16.5 16.5 L18.5 18.5 M18.5 5.5 L16.5 7.5 M7.5 16.5 L5.5 18.5" />
  {% endif %}
</svg>
{% endwith %}
